name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Usa a versão declarada em "packageManager" do package.json raiz
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # O build do web exige env do Supabase presentes (checagem estrutural,
      # nenhuma chamada de rede é feita no build com estes valores)
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
          SERVICE_ROLE: dummy-service-role
          NEXT_PUBLIC_AGORA_APP_ID: dummy-app-id
          APP_CERTIFICATE: dummy-app-certificate
